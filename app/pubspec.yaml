name: chaerok
description: "성공습관 — 폰 하나로만 도는 계획 달력 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

# 이름 `chaerok`은 갈라지기 전 그대로 둔다(import 경로). 플러그인 의존성이 없다 — 계획 전용이라
# 알림·녹음·네트워크·웹뷰를 쓰지 않는다(수집·AI 쪽 의존성은 M채록 저장소로 갔다, 2026-11-21).
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  dart_code_linter: ^4.4.3

flutter:
  uses-material-design: true

  # 글꼴 Gothic A1(Google Fonts, OFL — 라이선스 원문 assets/fonts/OFL.txt). 기존판 2026-11-17 디자인 B 시안과 같다.
  fonts:
    - family: GothicA1
      fonts:
        - asset: assets/fonts/GothicA1-Regular.ttf
        - asset: assets/fonts/GothicA1-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GothicA1-ExtraBold.ttf
          weight: 800
